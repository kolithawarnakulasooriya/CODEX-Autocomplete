name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: vscode-marketplace-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate publisher and release tag
        shell: bash
        run: |
          publisher="$(node -p "require('./package.json').publisher")"
          version="$(node -p "require('./package.json').version")"

          if [[ "$publisher" == "local-development" ]]; then
            echo "::error file=package.json::Replace the placeholder publisher with your Visual Studio Marketplace publisher ID."
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version."
            exit 1
          fi

          echo "Publishing $publisher.autocomplete-codex version $version"

      - name: Compile and run tests
        run: npm run check

      - name: Publish with Marketplace trusted publishing
        run: npx --no-install vsce publish --oidc
