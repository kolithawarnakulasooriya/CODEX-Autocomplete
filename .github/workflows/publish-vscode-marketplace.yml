name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: vscode-marketplace-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKETPLACE_ID: ${{ secrets.MARKETPLACE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure publisher and validate release tag
        shell: bash
        run: |
          if [[ -z "$MARKETPLACE_ID" ]]; then
            echo "::error::The MARKETPLACE_ID repository secret is required. Set it to your Visual Studio Marketplace publisher ID."
            exit 1
          fi

          npm pkg set publisher="$MARKETPLACE_ID"

          publisher="$(node -p "require('./package.json').publisher")"
          version="$(node -p "require('./package.json').version")"

          if [[ "$publisher" != "$MARKETPLACE_ID" ]]; then
            echo "::error file=package.json::Failed to configure the Marketplace publisher ID."
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version."
            exit 1
          fi

          echo "Publishing $publisher.autocomplete-codex version $version"

      - name: Compile and run tests
        run: npm run check

      - name: Publish with Marketplace trusted publishing
        run: npx --no-install vsce publish --oidc
